# Pinned CMSIS.
#
# The single source of truth for which CMSIS this firmware is built on.
# tools/update-cmsis.sh reads it and vendors exactly what it names; ext/cmsis/
# is that script's output and is never edited by hand.
#
# To move to a new release:
#   1. Edit the tag and commit below. Resolve a tag to its commit with:
#        git ls-remote <repo> 'refs/tags/<tag>^{}'
#   2. Run tools/update-cmsis.sh and review the diff. Vendored files are
#      unmodified upstream copies, so anything else in the diff is an error.
#   3. Build every board before committing.
#
# Rows are:  <component>  <repo>  <tag>  <commit>
#
# The tag is human-readable; the commit is the pin, since a tag can be moved
# upstream and a commit cannot. The script fetches the tag and fails if it does
# not resolve to the commit named here.
#
# <component> is `core` for ARM's Cortex-M support, or an STM32 family name
# matching RFX_CMSIS_FAMILY in cmake/mcu/<mcu>.cmake. A family needs a row here
# the first time an MCU of that family is added. Which part headers are taken
# out of a family is not configured here: cmake/mcu/ names them and the script
# reads that.

core     https://github.com/ARM-software/CMSIS_6               v6.3.0   45dab712ad84f8cbbf2b7bfc089c19088507df6f
STM32F7  https://github.com/STMicroelectronics/cmsis_device_f7 v1.2.10  2352e888e821aa0f4fe549bd5ea81d29c67a3222
STM32H7  https://github.com/STMicroelectronics/cmsis_device_h7 v1.10.7  8f922cdc7cc6de2344e75ddd657889f4ff761790

